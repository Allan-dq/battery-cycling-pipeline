[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-cycling-pipeline"
version = "0.1.0"
description = "ETL, data-quality checks and early-cycle life prediction on public battery-cycling data"
readme = "README.md"
# cellpy 2.x requires Python 3.13
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Qin (Allan) Dai" }]
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "h5py>=3.12",
    "duckdb>=1.1",
    "scipy>=1.14",
    "scikit-learn>=1.6",
    "mlflow>=3.0",
    "cellpy>=2.1",
    "prometheus-client>=0.21",
    "matplotlib>=3.9",
    "certifi",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.32"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.8"]

[project.scripts]
bcp = "battery_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
battery_pipeline = ["sql/*.sql", "instruments/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: runs several pipeline stages on the committed fixture",
    "e2e: runs the whole CLI on the committed fixture",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
